name: Release

on:
  push:
    branches: [ master, main ]
    tags: [ '*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag matching modVersion, or leave empty to use modVersion'
        required: false
        default: ''
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      force_release:
        description: 'Force release even if version matches latest release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      target_tag: ${{ steps.check.outputs.target_tag }}
      release_title: ${{ steps.check.outputs.release_title }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      make_latest: ${{ steps.check.outputs.make_latest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if release is needed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANUAL_TAG: ${{ inputs.tag_name }}
          FORCE_RELEASE: ${{ inputs.force_release }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          MOD_VERSION=$(grep -E '^[[:space:]]*modVersion[[:space:]]*=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')

          LATEST_RELEASE_TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || echo "")
          echo "Current modVersion: '$MOD_VERSION'"
          echo "Latest release tag: '$LATEST_RELEASE_TAG'"

          SHOULD_RELEASE="true"
          TARGET_TAG=""
          RELEASE_TITLE=""
          IS_PRE="false"
          MAKE_LATEST="true"

          if [[ -n "$MANUAL_TAG" ]]; then
            TARGET_TAG="$MANUAL_TAG"
            RELEASE_TITLE="LootGameSolver $MANUAL_TAG"
            IS_PRE="${MANUAL_PRERELEASE:-false}"
            MAKE_LATEST=$([[ "$IS_PRE" == "true" ]] && echo "false" || echo "true")
          elif [[ "$IS_TAG" == "true" ]]; then
            TARGET_TAG="$REF_NAME"
            RELEASE_TITLE="LootGameSolver $REF_NAME"
            if [[ "$REF_NAME" == *-snapshot || "$REF_NAME" == *-pre ]]; then
              IS_PRE="true"
              MAKE_LATEST="false"
            else
              IS_PRE="false"
              MAKE_LATEST="true"
            fi
          else
            # Push to main/master branch
            TARGET_TAG="${MOD_VERSION:-latest}"
            RELEASE_TITLE="LootGameSolver ${MOD_VERSION:-Latest Build}"
            if [[ "$TARGET_TAG" == *-snapshot || "$TARGET_TAG" == *-pre ]]; then
              IS_PRE="true"
              MAKE_LATEST="false"
            else
              IS_PRE="false"
              MAKE_LATEST="true"
            fi

            if [[ "$FORCE_RELEASE" != "true" && -n "$LATEST_RELEASE_TAG" && "$MOD_VERSION" == "$LATEST_RELEASE_TAG" ]]; then
              echo "Version '$MOD_VERSION' already matches latest release '$LATEST_RELEASE_TAG'. Skipping release."
              SHOULD_RELEASE="false"
            fi
          fi

          if [[ "${TARGET_TAG#v}" != "$MOD_VERSION" ]]; then
            echo "Release tag must match modVersion" >&2
            exit 1
          fi
          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
              echo "Release already exists; refusing to upload this version again" >&2
              exit 1
            fi
          fi
          echo "should_release=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT
          echo "target_tag=${TARGET_TAG}" >> $GITHUB_OUTPUT
          echo "release_title=${RELEASE_TITLE}" >> $GITHUB_OUTPUT
          echo "is_prerelease=${IS_PRE}" >> $GITHUB_OUTPUT
          echo "make_latest=${MAKE_LATEST}" >> $GITHUB_OUTPUT

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Determine JDK versions
        id: list-jdk-versions
        shell: bash
        run: |
          (
            echo 'java-versions<<EOF'
            echo 8
            echo 17
            echo 21
            if [[ -f gradle/gradle-daemon-jvm.properties ]]; then
              yq -pprops -oprops '.toolchainVersion' gradle/gradle-daemon-jvm.properties
            fi
            echo EOF
          ) | tee -a "${GITHUB_OUTPUT}"

      - name: Set up JDK versions
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.list-jdk-versions.outputs.java-versions }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check public feature gate
        run: |
          grep -q 'public static final boolean ENABLED = false;' src/main/java/com/kyroxova/lootgamesolver/client/ExplorationBeta.java || { echo "Disable exploration beta before publishing"; exit 1; }

      - name: Setup workspace
        run: ./gradlew setupCIWorkspace

      - name: Build mod
        run: ./gradlew build --parallel --max-workers=4

      - name: Prepare release changelog notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^modVersion=//p' gradle.properties | tr -d '\r')
          NOTES=$(sed -n 's/^releaseChangelog=//p' gradle.properties | tr -d '\r')
          test -s "$NOTES"
          JAR="build/libs/lootgamesolver-${VERSION}.jar"
          test -f "$JAR"
          unzip -p "$JAR" META-INF/CHANGELOG.md > build/release_body.md
          cmp "$NOTES" build/release_body.md
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_FILE=$GITHUB_WORKSPACE/$NOTES" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.check-version.outputs.target_tag }}
          name: ${{ needs.check-version.outputs.release_title }}
          body_path: build/release_body.md
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.check-version.outputs.make_latest }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          files: ${{ steps.release-notes.outputs.jar }}

      - name: Publish to CurseForge

        run: |
          test -n "$CURSEFORGE_TOKEN" || { echo "Missing CURSEFORGE_TOKEN secret"; exit 1; }
          ./gradlew publishCurseforge --no-configuration-cache
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

