name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      target_tag: ${{ steps.check.outputs.target_tag }}
      release_title: ${{ steps.check.outputs.release_title }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
      make_latest: ${{ steps.check.outputs.make_latest }}
      github_release_exists: ${{ steps.check.outputs.github_release_exists }}
      release_commit_sha: ${{ steps.check.outputs.release_commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine if release is needed
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MOD_VERSION=$(grep -E '^[[:space:]]*modVersion[[:space:]]*=' gradle.properties | cut -d'=' -f2 | tr -d ' \r\n')
          echo "Current modVersion: '$MOD_VERSION'"

          SHOULD_RELEASE="true"
          TARGET_TAG="${MOD_VERSION:-latest}"
          RELEASE_TITLE="LootGameSolver ${MOD_VERSION:-Latest Build}"
          if [[ "$TARGET_TAG" == *-snapshot || "$TARGET_TAG" == *-pre ]]; then
            IS_PRE="true"
            MAKE_LATEST="false"
          else
            IS_PRE="false"
            MAKE_LATEST="true"
          fi

          if [[ "${TARGET_TAG#v}" != "$MOD_VERSION" ]]; then
            echo "Release tag must match modVersion" >&2
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/${TARGET_TAG}^{commit}" >/dev/null; then
            RELEASE_COMMIT_SHA=$(git rev-parse "refs/tags/${TARGET_TAG}^{commit}")
          else
            RELEASE_COMMIT_SHA=$(git rev-parse HEAD)
          fi
          GITHUB_RELEASE_EXISTS="false"
          if RELEASE_RESULT=$(gh api "repos/${{ github.repository }}/releases/tags/$TARGET_TAG" 2>&1); then
            GITHUB_RELEASE_EXISTS="true"
            SHOULD_RELEASE="false"
            echo "Release $TARGET_TAG already exists; skipping duplicate publication."
          elif [[ "$RELEASE_RESULT" != *"HTTP 404"* ]]; then
            echo "Could not verify the GitHub release: $RELEASE_RESULT" >&2
            exit 1
          fi
          if [[ "$SHOULD_RELEASE" == "true" && "$RELEASE_COMMIT_SHA" != "$(git rev-parse HEAD)" ]]; then
            echo "The existing tag points to a different commit; refusing to release." >&2
            exit 1
          fi
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "target_tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "github_release_exists=${GITHUB_RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "release_commit_sha=${RELEASE_COMMIT_SHA}" >> "$GITHUB_OUTPUT"

  release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          ref: ${{ needs.check-version.outputs.release_commit_sha }}

      - name: Determine JDK versions
        id: list-jdk-versions
        shell: bash
        run: |
          (
            echo 'java-versions<<EOF'
            echo 8
            echo 17
            echo 21
            if [[ -f gradle/gradle-daemon-jvm.properties ]]; then
              yq -pprops -oprops '.toolchainVersion' gradle/gradle-daemon-jvm.properties
            fi
            echo EOF
          ) | tee -a "${GITHUB_OUTPUT}"

      - name: Set up JDK versions
        uses: actions/setup-java@v4
        with:
          java-version: ${{ steps.list-jdk-versions.outputs.java-versions }}
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup workspace
        run: ./gradlew setupCIWorkspace

      - name: Build mod
        run: ./gradlew build --parallel --max-workers=4

      - name: Obtain Baritone jar for bundled release
        id: baritone
        uses: ./.github/actions/build-baritone

      - name: Build bundled Baritone mod
        run: ./gradlew bundledBaritoneJar -PbaritoneJar="${{ steps.baritone.outputs.jar_path }}"

      - name: Prepare release changelog notes
        id: release-notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^[[:space:]]*modVersion[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d ' \r\n')
          NOTES=$(sed -n 's/^[[:space:]]*releaseChangelog[[:space:]]*=[[:space:]]*\(.*[^[:space:]]\)[[:space:]]*$/\1/p' gradle.properties | tr -d '\r')
          test -s "$NOTES"
          JAR="build/libs/lootgamesolver-${VERSION}.jar"
          test -f "$JAR"
          SIZE=$(stat -c %s "$JAR")
          test "$SIZE" -ge 8000000 && test "$SIZE" -le 20000000
          unzip -l "$JAR" | grep 'baritone/api/BaritoneAPI.class' > /dev/null
          unzip -p "$JAR" META-INF/CHANGELOG.md > build/release_body.md
          cmp "$NOTES" build/release_body.md
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_FILE=$GITHUB_WORKSPACE/$NOTES" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        if: needs.check-version.outputs.github_release_exists != 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ needs.check-version.outputs.target_tag }}
          name: ${{ needs.check-version.outputs.release_title }}
          body_path: build/release_body.md
          prerelease: ${{ needs.check-version.outputs.is_prerelease == 'true' }}
          make_latest: ${{ needs.check-version.outputs.make_latest }}
          target_commitish: ${{ needs.check-version.outputs.release_commit_sha }}
          generate_release_notes: false
          files: ${{ steps.release-notes.outputs.jar }}
      - name: Publish to CurseForge
        if: needs.check-version.outputs.is_prerelease != 'true'
        run: |
          test -n "$CURSEFORGE_TOKEN" || { echo "Missing CURSEFORGE_TOKEN secret"; exit 1; }
          ./gradlew publishCurseforge -PbaritoneJar="${{ steps.baritone.outputs.jar_path }}" --no-configuration-cache
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}

  sync-description:
    needs: [check-version, release]
    if: needs.check-version.outputs.is_prerelease != 'true'
    uses: ./.github/workflows/sync-curseforge-description.yml
    with:
      release_commit: ${{ needs.check-version.outputs.release_commit_sha }}
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
