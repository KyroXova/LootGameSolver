name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  build-bundled:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LootGameSolver
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK versions
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
            21
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Obtain Baritone jar
        id: baritone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p baritone-bin
          if gh release download --repo KyroXova/baritone --pattern "*baritone*.jar" --dir baritone-bin 2>/dev/null; then
            BARITONE_JAR=$(find baritone-bin -name "*dev.jar" -o -name "*.jar" | head -n 1)
            echo "Downloaded Baritone jar from release: $BARITONE_JAR"
          fi
          if [ -z "${BARITONE_JAR:-}" ] || [ ! -f "${BARITONE_JAR:-}" ]; then
            echo "Building Baritone from KyroXova/baritone source..."
            git clone --depth 1 https://github.com/KyroXova/baritone.git baritone-src
            cd baritone-src
            chmod +x gradlew
            ./gradlew build -x test --parallel --max-workers=4
            cd ..
            BARITONE_JAR=$(find baritone-src/build/libs -name "*dev.jar" -o -name "*baritone*.jar" | head -n 1)
          fi
          echo "jar_path=$(realpath "$BARITONE_JAR")" >> "$GITHUB_OUTPUT"

      - name: Build bundled LootGameSolver with Baritone
        run: |
          chmod +x gradlew
          ./gradlew bundledBaritoneJar -PbaritoneJar="${{ steps.baritone.outputs.jar_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lootgamesolver
          path: build/libs/lootgamesolver-*.jar
