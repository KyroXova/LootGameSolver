name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  build-bundled:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout LootGameSolver
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK versions
        uses: actions/setup-java@v4
        with:
          java-version: |
            8
            17
            21
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Obtain Baritone jar
        id: baritone
        run: |
          set -euo pipefail
          git clone --depth 1 --branch 1.7.10-LGS https://github.com/KyroXova/baritone.git baritone-src
          (cd baritone-src && chmod +x gradlew && ./gradlew reobfJar --parallel --max-workers=4)
          BARITONE_JAR=baritone-src/build/libs/baritone-1.7.10-1.20.0-1.7.10-dev.jar
          test -f "$BARITONE_JAR"
          echo "jar_path=$(realpath "$BARITONE_JAR")" >> "$GITHUB_OUTPUT"

      - name: Build bundled LootGameSolver with Baritone
        run: |
          chmod +x gradlew
          ./gradlew bundledBaritoneJar -PbaritoneJar="${{ steps.baritone.outputs.jar_path }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lootgamesolver
          path: build/libs/lootgamesolver-*.jar
